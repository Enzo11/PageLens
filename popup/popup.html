<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PageLens</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="app">
    <header class="top">
      <div class="brand">
        <img src="../icons/icon32.png" alt="" width="22" height="22">
        <div class="brand-text">
          <div class="brand-name">PageLens</div>
          <div class="host" id="host" title="">Reading tab…</div>
        </div>
      </div>
      <div class="top-actions">
        <button class="icon-btn" id="rescan" type="button" title="Scan again" aria-label="Scan again">
          <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M16 10a6 6 0 1 1-1.76-4.24M16 4v3.5h-3.5" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <button class="icon-btn" id="settings" type="button" title="Settings" aria-label="Settings">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1Z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg>
        </button>
        <button class="icon-btn" id="theme" type="button" title="Theme: system" aria-label="Theme: system">
          <svg viewBox="0 0 20 20" aria-hidden="true" data-icon="system"><rect x="3" y="4" width="14" height="10" rx="2" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M7 17h6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
          <svg viewBox="0 0 20 20" aria-hidden="true" data-icon="light"><circle cx="10" cy="10" r="3.4" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M10 2.5v2M10 15.5v2M2.5 10h2M15.5 10h2M4.7 4.7l1.4 1.4M13.9 13.9l1.4 1.4M4.7 15.3l1.4-1.4M13.9 6.1l1.4-1.4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
          <svg viewBox="0 0 20 20" aria-hidden="true" data-icon="dark"><path d="M15.5 12.6A6.5 6.5 0 0 1 7.4 4.5a6.5 6.5 0 1 0 8.1 8.1Z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>
        </button>
      </div>
    </header>

    <div class="controls">
      <div class="seg" role="radiogroup" aria-label="Mode" id="mode">
        <button type="button" role="radio" data-mode="website" aria-checked="true">Website</button>
        <button type="button" role="radio" data-mode="github" aria-checked="false">Repo</button>
        <button type="button" role="radio" data-mode="package" aria-checked="false">Package</button>
      </div>
      <label class="role">
        <span>View as</span>
        <select id="role">
          <option value="everyday">Everyday user</option>
          <option value="designer">Designer</option>
          <option value="developer">Developer</option>
          <option value="security">Security</option>
        </select>
      </label>
    </div>

    <nav class="tabs" role="tablist" aria-label="Report sections" id="tabs"></nav>

    <main class="view" id="view" tabindex="-1" aria-live="polite"></main>

    <footer class="actions">
      <button type="button" class="btn" id="act-report" disabled>
        <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M5 3h7l3 3v11H5z M12 3v3h3" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg>
        Full report
      </button>
      <button type="button" class="btn" id="act-css" disabled>
        <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M7 6 3 10l4 4M13 6l4 4-4 4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
        Copy CSS
      </button>
      <button type="button" class="btn" id="act-export" disabled aria-haspopup="menu" aria-expanded="false">
        <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M10 3v9m0 0-3.5-3.5M10 12l3.5-3.5M4 15h12" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
        Export
      </button>
      <button type="button" class="btn" id="act-history" disabled aria-pressed="false">
        <svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="6.5" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M10 6.5V10l2.5 1.5" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
        History
      </button>
    </footer>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>
  </div>

  <script src="../lib/color.js"></script>
  <script src="../lib/tokens.js"></script>
  <script src="../lib/score.js"></script>
  <script src="../lib/headers.js"></script>
  <script src="../lib/csp-builder.js"></script>
  <script src="../lib/server-fixes.js"></script>
  <script src="../lib/trackers.js"></script>
  <script src="../lib/report.js"></script>
  <script src="../lib/pipeline.js"></script>
  <script src="../lib/history.js"></script>
  <script src="../lib/report-model.js"></script>
  <script src="../lib/export-markdown.js"></script>
  <script src="../lib/export-html.js"></script>
  <script src="../lib/compare.js"></script>
  <script src="../content/analyze.js"></script>
  <script src="../github/github-mode.js"></script>
  <script src="../github/forges.js"></script>
  <script src="../github/packages.js"></script>
  <script src="popup.js"></script>
</body>
</html>
